name: Data Crawler

on:
  schedule:
    # Run hourly at :05 (offset from :00 to avoid peak)
    - cron: '5 * * * *'
  workflow_dispatch:  # Manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - 'crawler/**'
      - '.github/workflows/crawl.yml'

concurrency:
  group: crawler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: Run crawler
        run: python -m crawler.main
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and push data changes
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: auto-update leaderboard data [skip ci]"
          git push
